name: Release

# Publishes a signed APK to the Releases page, named by version and build date.
#
# Trigger either by pushing a tag (v1.2.0) or manually from the Actions tab.
# The manual path derives the tag from app/build.gradle.kts, so the version
# lives in exactly one place.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read version and build date
        id: meta
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          DATE=$(date -u +%Y%m%d)
          DATE_READABLE=$(date -u +'%Y-%m-%d %H:%M UTC')

          # A tag push must agree with the manifest, otherwise the published
          # artifact would not match its own release notes.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [ "$TAG" != "v$NAME" ]; then
              echo "::error::Tag $TAG does not match versionName $NAME in app/build.gradle.kts"
              exit 1
            fi
          else
            TAG="v$NAME"
          fi

          echo "name=$NAME"          >> "$GITHUB_OUTPUT"
          echo "code=$CODE"          >> "$GITHUB_OUTPUT"
          echo "date=$DATE"          >> "$GITHUB_OUTPUT"
          echo "date_readable=$DATE_READABLE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "apk=MaterialFlux-$NAME-$DATE.apk" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret; the APK will be signed with the debug key and is not distributable."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Assemble release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK by version and date
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "${{ steps.meta.outputs.apk }}"
          ls -lh "${{ steps.meta.outputs.apk }}"

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "${{ steps.meta.outputs.apk }}"

      - name: Compute checksum
        id: sum
        run: |
          SHA=$(sha256sum "${{ steps.meta.outputs.apk }}" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }} (${{ steps.meta.outputs.date }})
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
          body: |
            **版本** ${{ steps.meta.outputs.name }} · versionCode ${{ steps.meta.outputs.code }}
            **构建时间** ${{ steps.meta.outputs.date_readable }}
            **提交** ${{ github.sha }}

            ### 下载
            `${{ steps.meta.outputs.apk }}`

            SHA-256
            ```
            ${{ steps.sum.outputs.sha256 }}
            ```

            ### 环境要求
            Android 7.0（API 24）及以上。

            ### 汇率数据
            以欧洲央行每日参考汇率为基准，EUR→USD 重基在应用内完成以保留完整精度。
            贵金属与数字资产为实时现货价。所有汇率为中间市场价，不含点差，仅供参考。

      - name: Clean up signing material
        if: always()
        run: rm -rf keystore keystore.properties
